name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, package
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Package app bundle
        run: scripts/build.sh package

      - name: Verify app bundle
        run: scripts/build.sh verify

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/OptTab.app build/OptTab.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: OptTab-app
          path: build/OptTab.app.zip
          if-no-files-found: error
